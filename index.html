<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mapa GF Saneamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="cofre-css">
  :root { --bg: #EEF3F4; --surface: #fff; --ink: #0C2A33; --muted: #5B6B70; --line: #D2DCDF; --accent: #0B7A8F; --danger: #C2412D; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0A181E; --surface: #10232B; --ink: #E6F0F2; --muted: #98AEB6; --line: #26434E; --accent: #3FB6CB; --danger: #F0796B; } }
  .cofre, .cofre * { box-sizing: border-box; }
  .cofre [hidden] { display: none !important; }
  body.travado { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(circle at 70% 20%, color-mix(in srgb, var(--accent) 16%, var(--bg)), var(--bg) 60%); font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); padding: 20px; }
  .cofre { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px 22px; box-shadow: 0 18px 50px rgba(12, 42, 51, .14); display: flex; flex-direction: column; gap: 16px; }
  .cofre .marca { display: flex; align-items: center; gap: 10px; }
  .cofre .marca strong { font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; display: block; line-height: 1.1; }
  .cofre .marca small { color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-size: 11.5px; }
  .cofre h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 20px; margin: 4px 0 0; }
  .cofre p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
  .cofre label.campo { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 14.5px; }
  .cofre .senha { position: relative; }
  .cofre input[type="password"], .cofre input[type="text"], .cofre input[type="email"] { width: 100%; min-height: 48px; padding: 10px 52px 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 17px; letter-spacing: .02em; }
  .cofre input:focus { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
  .cofre .ver { position: absolute; right: 6px; top: 6px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--accent); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .cofre .lembrar { display: flex; align-items: center; gap: 9px; font-size: 14.5px; }
  .cofre .lembrar input { width: 19px; height: 19px; accent-color: var(--accent); }
  .cofre button.entrar { min-height: 50px; border: 0; border-radius: 13px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 16.5px; cursor: pointer; }
  .cofre button.entrar:disabled { opacity: .6; cursor: progress; }
  .cofre .erro { color: var(--danger); font-weight: 500; font-size: 14.5px; }
  .cofre .alt { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
  .cofre .aviso { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 12px; padding: 10px 12px; color: var(--ink); font-size: 14px; }
  .cofre .aviso a { color: var(--accent); font-weight: 600; }
  .cofre .rodape { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body class="travado">
<main class="cofre" id="cofre" aria-labelledby="cofre-t">
  <div class="marca"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M16 3c5 6.2 9 10.6 9 15.6A9 9 0 0 1 7 18.6C7 13.6 11 9.2 16 3z" fill="#0B7A8F"/></svg><span><strong>Mapa GF</strong><small>Saneamento</small></span></div>
  <form id="f-cofre" novalidate>
    <div style="display:flex;flex-direction:column;gap:14px">
      <h1 id="cofre-t">Entrar</h1>
      <p id="cofre-msg">Use o e-mail e a senha da sua conta da equipe. Os leads ficam salvos na conta e aparecem em qualquer aparelho.</p>
      <label class="campo" id="l-nome" hidden><span>Seu nome</span><input type="text" id="c-nome" autocomplete="name"></label>
      <label class="campo"><span>E-mail</span><input type="email" id="c-email" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" required></label>
      <label class="campo"><span id="cofre-rot">Senha</span><span class="senha"><input type="password" id="c-senha" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button class="ver" type="button" id="c-ver" aria-pressed="false">Mostrar</button></span></label>
      <label class="campo" id="l-codigo" hidden><span>Código de primeiro acesso</span><input type="text" id="c-codigo" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <p class="erro" id="c-erro" role="alert" hidden></p>
      <button class="entrar" type="submit" id="c-ok">Entrar</button>
      <button class="alt" type="button" id="c-modo">Primeiro acesso da equipe</button>
      <p class="aviso" id="c-aviso" hidden></p>
    </div>
  </form>
  <p class="rodape"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>Só quem foi convidado pela equipe entra. O app e os dados guardados no aparelho são cifrados com AES-256.</p>
</main>

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = u8 => { let s = ''; const b = new Uint8Array(u8); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriva(senha, sal, it = 600000) {
  const base = await crypto.subtle.importKey('raw', enc.encode(senha.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(sal), iterations: it }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const importa = b => crypto.subtle.importKey('raw', unb64(b), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
const abrePacote = async k => JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.iv) }, k, unb64(P.ct))));
async function cifra(u8) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chave, u8); return { s: SAL, iv: b64(iv), ct }; }
async function decifra(env) { const k = env.s === SAL ? chave : chaves.get(env.s); if (!k) { const e = new Error('outra-senha'); e.sal = env.s; throw e; } return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, k, typeof env.ct === 'string' ? unb64(env.ct) : env.ct)); }

/* chave da equipe lembrada no aparelho (CryptoKey não exportável), para abrir sem rede */
const db = () => new Promise((ok, no) => { const r = indexedDB.open('gf-porta', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
async function kv(modo, fn) { const d = await db(); return new Promise((ok, no) => { const t = d.transaction('k', modo), q = fn(t.objectStore('k')); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }); }
const lembra = k => kv('readwrite', s => s.put(k, 'chave')).catch(() => {});
const esquece = () => kv('readwrite', s => s.delete('chave')).catch(() => {});
const lembrada = () => kv('readonly', s => s.get('chave')).catch(() => null);
async function buscaChave() {
  const { data, error } = await sb.from('chave_app').select('chave').eq('id', 1).maybeSingle();
  if (error) { const e = new Error('rede'); e.det = error; throw e; }
  if (!data) throw new Error('sem-acesso');
  return importa(data.chave);
}

let uidAtual = '';
const K_DADOS = () => 'gf-dados-' + uidAtual;
let seq = 0;
const COFRE = {
  dados: null,
  salvar(txt) {
    const n = ++seq;
    cifra(enc.encode(txt)).then(e => { if (n !== seq) return; try { localStorage.setItem(K_DADOS(), JSON.stringify({ s: e.s, iv: e.iv, ct: b64(e.ct) })); } catch (x) { /* armazenamento cheio ou bloqueado */ } });
  },
  async cifraBlob(blob) { const e = await cifra(new Uint8Array(await blob.arrayBuffer())); return { gfc: 1, s: e.s, iv: e.iv, ct: e.ct, tipo: blob.type || '' }; },
  async decifraBlob(v) { return new Blob([await decifra(v)], { type: v.tipo || '' }); },
  async cifraTexto(txt) { const e = await cifra(enc.encode(txt)); return JSON.stringify({ app: 'mapa-gf-saneamento', cifrado: 1, s: e.s, iv: e.iv, ct: b64(e.ct) }); },
  async decifraTexto(env, senha) { if (env.s !== SAL && !chaves.has(env.s) && senha) chaves.set(env.s, await deriva(senha, env.s, env.it || 600000)); return dec.decode(await decifra(env)); },
  /* registros que este navegador guardava antes da conta da equipe */

  async sair() { try { await sb.auth.signOut({ scope: 'local' }); } catch (e) { /* sem rede */ } await esquece(); try { sessionStorage.clear(); } catch (e) { /* idem */ } location.reload(); }
};

async function dadosLocais() {
  let env = null; try { env = JSON.parse(localStorage.getItem(K_DADOS()) || 'null'); } catch (e) { env = null; }
  if (!env) return null;
  try { return dec.decode(await decifra(env)); } catch (e) { return null; }
}

function rodaApp(pac, sessao) {

  document.body.className = ''; document.body.innerHTML = pac.html;
  window.GF_COFRE = COFRE;
  window.GF_NUVEM = { sb, user: sessao.user, email: (sessao.user.email || '').toLowerCase(), site: SITE };
  for (const js of pac.js) { const sc = document.createElement('script'); sc.textContent = js; document.body.append(sc); }
}

async function entra(k, sessao) {

}

    let k = await lembrada();
    try {
      if (!k) { k = await buscaChave(); await lembra(k); }
      await entra(k, sessao); return;
    } catch (e) {
      if (e && e.message === 'sem-acesso') { await esquece(); await sb.auth.signOut({ scope: 'local' }); erro('Esta conta não faz mais parte da equipe.'); }
      else if (semRede(e)) avisoRede();
    }
  }
  $('c-email').focus();
})();
})();
</script>
